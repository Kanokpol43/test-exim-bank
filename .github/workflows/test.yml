name: Cucumber Tests

on:
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start API Docker container
        run: docker run -d --rm --name qa-practice-api -p8887:8081 rvancea/qa-practice-api:latest

      - name: Wait for API to be ready
        run: timeout 30 bash -c 'until curl -sf http://localhost:8887/swagger-ui.html; do sleep 1; done'

      - name: Run API tests
        run: npm run test:api

      - name: Run UI tests
        run: npm test

      - name: Generate report
        if: always()
        run: npm run test:report

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: reports/
